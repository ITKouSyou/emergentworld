id: gossip_mill
tags: [social, daily]
cooldown: 5
weight: 1.3
interactive: false
conditions:
  - director.tension < 0.6
params:
  participant_count: 2
  location: village_square
prompt: |
  两个村民在磨坊边闲聊，话题涉及另一位村民的隐私。
  内容应有一丝真实性，但也夹杂夸大与误传。
evaluator:
  require: [rumor_subject, gossip_content]
  max_reward: 0.1
